name: pipeline

on:
    push:
        branches:
            - main

jobs:
    pipeline:
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v7
        - uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
        - name: instalar dependencias
          run: bun i
        - name: test
          run: bun run vitest:run
        - name: build
          run: bun run dev
        # en este paso poner los test E2E
        # - name: E2E
          # uses: 
        - name: heroku
          run: ${{ secrets.GITHUB_TOKEN }}
          # lalalala